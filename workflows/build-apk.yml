name: Build Personnel APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "نوع خروجی (debug = تست و نصب سریع / release = امضاشده + AAB)"
        type: choice
        default: debug
        options: [debug, release]
      bundle_fonts:
        description: "فونت وزیرمتن داخل APK باشد؟ (برای کار کردن آفلاین)"
        type: choice
        default: "yes"
        options: ["yes", "no"]
      orientation:
        description: "جهت صفحه"
        type: choice
        default: portrait
        options: [portrait, auto]
      publish_release:
        description: "فایل‌ها در بخش Releases گیت‌هاب هم منتشر شوند؟"
        type: choice
        default: "no"
        options: ["no", "yes"]
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
  BUNDLE_FONTS: ${{ inputs.bundle_fonts || 'yes' }}
  ORIENTATION: ${{ inputs.orientation || 'portrait' }}
  PUBLISH_RELEASE: ${{ inputs.publish_release || 'no' }}
  VERSION_CODE: ${{ github.run_number }}
  ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
  ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
  ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # بدون cache برای npm، چون package-lock.json در پروژه نیست.
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Read app version
        shell: bash
        run: |
          echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Install npm dependencies
        shell: bash
        run: |
          npm install --no-package-lock --no-audit --no-fund

      - name: Prepare web files (www)
        shell: bash
        run: |
          node scripts/prepare-web.js

      - name: Create Android project
        shell: bash
        run: |
          rm -rf android
          npx cap add android

      - name: Prepare release keystore
        if: env.BUILD_TYPE == 'release'
        shell: bash
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::برای build_type=release باید ۴ سکرت ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD تنظیم شوند (راهنما در README-FA.md)."
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"

      - name: Patch Android project
        shell: bash
        run: |
          node scripts/patch-android.js

      - name: Generate app icons
        shell: bash
        run: |
          npx capacitor-assets generate --android

      - name: Sync web files
        shell: bash
        run: |
          npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        if: env.BUILD_TYPE == 'debug'
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Build release APK + AAB
        if: env.BUILD_TYPE == 'release'
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Collect outputs
        shell: bash
        run: |
          mkdir -p dist
          TAG="Personnel-v${VERSION_NAME}-build${VERSION_CODE}"
          if [ "$BUILD_TYPE" = "debug" ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk "dist/${TAG}-debug.apk"
          else
            cp android/app/build/outputs/apk/release/app-release.apk "dist/${TAG}-release.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "dist/${TAG}-release.aab"
          fi
          ls -la dist

      - name: Upload build reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports
            android/app/src/main/java
          if-no-files-found: ignore

      - name: Upload APK / AAB
        uses: actions/upload-artifact@v4
        with:
          name: Personnel-${{ env.BUILD_TYPE }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: env.PUBLISH_RELEASE == 'yes'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}-build${{ env.VERSION_CODE }}
          name: مدیریت پرسنل v${{ env.VERSION_NAME }} (build ${{ env.VERSION_CODE }})
          files: dist/*
